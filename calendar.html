<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Kegiatan - UNAI Event Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-globe"></i></div>
                <span>UNAI Events</span>
            </a>
            <div class="menu-toggle" onclick="toggleMobileMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="events.html">Daftar Acara</a></li>
                <li><a href="calendar.html" class="active">Kalender</a></li>
                <li><a href="admin.html" class="nav-admin-btn"><i class="fa-solid fa-lock"></i> Admin</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Kalender Bulanan Kegiatan</h2>
        <p class="section-subtitle">Jadwal kegiatan bulanan UNA Indonesia sepanjang tahun 2026.</p>

        <div class="calendar-wrapper">
            <div class="calendar-header">
                <h3 id="currentMonthYear" style="color: var(--primary);">Juli 2026</h3>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-outline" style="color: var(--primary); border-color: var(--border-color);" onclick="alert('Menampilkan jadwal tahun 2026')">&larr; Bulan Ini</button>
                </div>
            </div>

            <div class="calendar-grid">
                <div class="calendar-day-name">Sen</div>
                <div class="calendar-day-name">Sel</div>
                <div class="calendar-day-name">Rab</div>
                <div class="calendar-day-name">Kam</div>
                <div class="calendar-day-name">Jum</div>
                <div class="calendar-day-name">Sab</div>
                <div class="calendar-day-name">Min</div>
            </div>

            <div class="calendar-grid" id="calendarDaysGrid" style="margin-top: 8px;">
              
            </div>
        </div>
    </div>

   
    <footer>
        <div class="footer-bottom" style="border:none; padding: 2rem 0;">
            <p>&copy; 2026 United Nations Association Indonesia. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const events = JSON.parse(localStorage.getItem('unai_events')) || [];
        const grid = document.getElementById('calendarDaysGrid');

      
        let html = '';
        html += `<div class="calendar-cell empty"></div><div class="calendar-cell empty"></div>`;

        for(let d = 1; d <= 31; d++) {
            const dateStr = `2026-07-${d < 10 ? '0'+d : d}`;
            const matchedEvents = events.filter(e => e.date === dateStr);

            html += `
                <div class="calendar-cell">
                    <div class="calendar-date-num">${d}</div>
                    ${matchedEvents.map(ev => `
                        <a href="detail.html?id=${ev.id}">
                            <div class="calendar-event-dot" title="${ev.name}">${ev.name}</div>
                        </a>
                    `).join('')}
                </div>
            `;
        }
        grid.innerHTML = html;
    </script>
</body>
</html>
